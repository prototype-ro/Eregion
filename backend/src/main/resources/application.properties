spring.application.name=eregion-api

spring.datasource.url=${EREGION_DB_URL:jdbc:postgresql://localhost:5432/eregion}
spring.datasource.username=${EREGION_DB_USER:eregion}
spring.datasource.password=${EREGION_DB_PASSWORD:eregion}

# Logs: plain text in development; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash) for one JSON object per
# line in production. Every line written during a request carries its requestId (see RequestIdFilter).
logging.pattern.correlation=[%X{requestId:-}] 

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# HS256 signing secret, at least 32 bytes. Always override outside local dev.
eregion.jwt.secret=${EREGION_JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
eregion.jwt.ttl-minutes=${EREGION_JWT_TTL_MINUTES:720}

# dev or production. Production refuses placeholder secrets and always sends the cookie over HTTPS only.
eregion.env=${EREGION_ENV:dev}

# Send the login cookie only over HTTPS. Turn on for any deployment.
eregion.auth.cookie-secure=${EREGION_COOKIE_SECURE:false}

# Comma separated list of browser origins allowed to call the API.
eregion.cors.allowed-origins=${EREGION_CORS_ORIGINS:http://localhost:3000}

eregion.scryfall.user-agent=Eregion/0.1 (deck builder)
eregion.scryfall.delay-ms=200

# Custom art uploads. The limits are enforced again in the controller: per player, and for the whole site, where
# uploads pause at the limit.
eregion.art.per-user-mb=${EREGION_ART_PER_USER_MB:100}
eregion.art.site-mb=${EREGION_ART_SITE_MB:20480}
# Where the image bytes live: database (the default) or s3, any S3-compatible bucket (S3, Cloudflare R2, Backblaze
# B2, MinIO). With s3, new art goes to the bucket and a job moves the art already in the database there, 25 at a time.
eregion.art.store=${EREGION_ART_STORE:database}
eregion.art.s3.endpoint=${EREGION_ART_S3_ENDPOINT:}
eregion.art.s3.region=${EREGION_ART_S3_REGION:auto}
eregion.art.s3.bucket=${EREGION_ART_S3_BUCKET:}
eregion.art.s3.access-key=${EREGION_ART_S3_ACCESS_KEY:}
eregion.art.s3.secret-key=${EREGION_ART_S3_SECRET_KEY:}
eregion.art.s3.path-style=${EREGION_ART_S3_PATH_STYLE:true}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Rate limits. Defaults suit one small server. Turn them off with EREGION_RATE_ENABLED=false in tests only.
eregion.rate.enabled=${EREGION_RATE_ENABLED:true}
eregion.rate.trust-proxy=${EREGION_TRUST_PROXY:false}
# Where the counts live: database (shared by every API server, kept across restarts) or memory (one server only).
eregion.rate.store=${EREGION_RATE_STORE:database}
eregion.rate.login-per-ip15-min=${EREGION_RATE_LOGIN_IP:20}
eregion.rate.login-per-account15-min=${EREGION_RATE_LOGIN_ACCOUNT:8}
eregion.rate.register-per-ip-hour=${EREGION_RATE_REGISTER:10}
eregion.rate.mail-per-ip-hour=${EREGION_RATE_MAIL_IP:10}
eregion.rate.mail-per-address-hour=${EREGION_RATE_MAIL_ADDRESS:3}
eregion.rate.search-per-user-minute=${EREGION_RATE_SEARCH:120}
eregion.rate.resolve-per-user-minute=${EREGION_RATE_RESOLVE:20}
eregion.rate.upload-per-user-minute=${EREGION_RATE_UPLOAD:40}
eregion.rate.url-import-per-user-hour=${EREGION_RATE_URL_IMPORT:30}

# Where the site is reachable by people. Emailed links point here.
eregion.public-url=${EREGION_PUBLIC_URL:http://localhost:3000}
# Mail goes out by SMTP when spring.mail.host is set. Without it, messages are written to the log.
eregion.mail.from=${EREGION_MAIL_FROM:Eregion <no-reply@localhost>}
# For real email set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD.
eregion.rate.public-read-per-ip-minute=${EREGION_RATE_PUBLIC:240}
eregion.rate.report-per-user-hour=${EREGION_RATE_REPORT:10}
# Accounts that may moderate (reports, disabling accounts, removing art) on /admin, as a comma separated list of emails.
eregion.admin.emails=${EREGION_ADMIN_EMAILS:}
# Each deck report is emailed here as it arrives. Leave blank to only store reports in deck_reports.
eregion.moderation.email=${EREGION_MODERATION_EMAIL:}
eregion.rate.save-per-user-minute=${EREGION_RATE_SAVE:30}
eregion.rate.analysis-per-user-minute=${EREGION_RATE_ANALYSIS:30}

# Functional roles (Ramp, Removal, ...) from Scryfall Tagger. The sync reads about a hundred search pages, so it runs once a day,
# and not at all on a restart if it already ran within min-age-hours. Set min-age-hours=0 to force a run at the next start.
eregion.functional-tags.enabled=true
eregion.functional-tags.initial-delay-ms=60000
eregion.functional-tags.every-ms=86400000
eregion.functional-tags.min-age-hours=20

# Game Changers and extra turn cards, read from Scryfall once a day (about two requests), so a new Game Changers list needs no release.
eregion.bracket-flags.enabled=true
eregion.bracket-flags.initial-delay-ms=120000
eregion.bracket-flags.every-ms=86400000
eregion.bracket-flags.min-age-hours=20

# Scryfall's whole oracle-cards bulk file (one row per unique card name), loaded once a week by default, so search and
# decklist import can answer almost any real card from our own database instead of calling the live Scryfall API per name.
eregion.bulk-catalog.enabled=true
eregion.bulk-catalog.initial-delay-ms=180000
eregion.bulk-catalog.every-ms=86400000
eregion.bulk-catalog.min-age-hours=168

# Prices refresh every few hours, 75 cards per Scryfall request. min-interval-minutes keeps a dev restart from
# re-spending that budget within seconds of the last run, separately from stale-hours, which governs each card.
eregion.prices.stale-hours=24
eregion.prices.per-run=600
eregion.prices.min-interval-minutes=15

# Combos come from Commander Spellbook's public API. Turn it off and the combo block is simply marked unavailable.
eregion.spellbook.enabled=true

# Proxy creator and lore assistant. Off unless turned on: the site hides them, and their model calls answer 404.
eregion.assistant.enabled=${EREGION_ASSISTANT_ENABLED:false}
# The model writes card art prompts. Without a key, generation answers with a message naming this setting.
eregion.llm.api-key=${EREGION_LLM_API_KEY:}
eregion.llm.url=${EREGION_LLM_URL:https://api.deepseek.com/chat/completions}
eregion.llm.model=${EREGION_LLM_MODEL:deepseek-reasoner}
eregion.llm.json-model=${EREGION_LLM_JSON_MODEL:deepseek-chat}
eregion.rate.proxy-per-user-minute=${EREGION_RATE_PROXY:30}
eregion.rate.lore-per-user-minute=${EREGION_RATE_LORE:30}
