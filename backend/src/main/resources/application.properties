spring.application.name=eregion-api

spring.datasource.url=${EREGION_DB_URL:jdbc:postgresql://localhost:5432/eregion}
spring.datasource.username=${EREGION_DB_USER:eregion}
spring.datasource.password=${EREGION_DB_PASSWORD:eregion}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# HS256 signing secret, at least 32 bytes. Always override outside local dev.
eregion.jwt.secret=${EREGION_JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
eregion.jwt.ttl-minutes=${EREGION_JWT_TTL_MINUTES:720}

# dev or production. Production refuses placeholder secrets and always sends the cookie over HTTPS only.
eregion.env=${EREGION_ENV:dev}

# Send the login cookie only over HTTPS. Turn on for any deployment.
eregion.auth.cookie-secure=${EREGION_COOKIE_SECURE:false}

# Comma separated list of browser origins allowed to call the API.
eregion.cors.allowed-origins=${EREGION_CORS_ORIGINS:http://localhost:3000}

eregion.scryfall.user-agent=Eregion/0.1 (deck builder)
eregion.scryfall.delay-ms=200

# Custom art uploads. The limits are enforced again in the controller.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Rate limits. Defaults suit one small server. Turn them off with EREGION_RATE_ENABLED=false in tests only.
eregion.rate.enabled=${EREGION_RATE_ENABLED:true}
eregion.rate.trust-proxy=${EREGION_TRUST_PROXY:false}
eregion.rate.login-per-ip15-min=${EREGION_RATE_LOGIN_IP:20}
eregion.rate.login-per-account15-min=${EREGION_RATE_LOGIN_ACCOUNT:8}
eregion.rate.register-per-ip-hour=${EREGION_RATE_REGISTER:10}
eregion.rate.mail-per-ip-hour=${EREGION_RATE_MAIL_IP:10}
eregion.rate.mail-per-address-hour=${EREGION_RATE_MAIL_ADDRESS:3}
eregion.rate.search-per-user-minute=${EREGION_RATE_SEARCH:120}
eregion.rate.resolve-per-user-minute=${EREGION_RATE_RESOLVE:20}
eregion.rate.upload-per-user-minute=${EREGION_RATE_UPLOAD:40}
eregion.rate.url-import-per-user-hour=${EREGION_RATE_URL_IMPORT:30}

# Where the site is reachable by people. Emailed links point here.
eregion.public-url=${EREGION_PUBLIC_URL:http://localhost:3000}
# Mail goes out by SMTP when spring.mail.host is set. Without it, messages are written to the log.
eregion.mail.from=${EREGION_MAIL_FROM:Eregion <no-reply@localhost>}
# For real email set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD.
eregion.rate.public-read-per-ip-minute=${EREGION_RATE_PUBLIC:240}
eregion.rate.report-per-user-hour=${EREGION_RATE_REPORT:10}
eregion.rate.save-per-user-minute=${EREGION_RATE_SAVE:30}

# Functional roles (Ramp, Removal, ...) from Scryfall Tagger. The sync reads about a hundred search pages, so it runs once a day,
# and not at all on a restart if it already ran within min-age-hours. Set min-age-hours=0 to force a run at the next start.
eregion.functional-tags.enabled=true
eregion.functional-tags.initial-delay-ms=60000
eregion.functional-tags.every-ms=86400000
eregion.functional-tags.min-age-hours=20
